.steps{list-style:none;counter-reset:st;margin:.6rem 0 0;padding:0;max-width:42rem}

.steps>li:last-child{border-left-color:transparent}

.steps .chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.45rem}

.chip2.f{background:var(--tape);border-color:var(--tape)}
.chip2.f,.chip2.f:visited{color:var(--page)}
.ck{list-style:none;margin:.5rem 0 0;padding:0;max-width:42rem}
.ck li{margin:0;border-bottom:1px solid var(--rule)}
.ck label{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem .2rem;cursor:pointer;font:400 1rem/1.45 var(--serif)}
.ck input{margin-top:.28rem;width:1.1rem;height:1.1rem;accent-color:var(--tape);flex:none}
.ck input:checked+span{color:var(--muted);text-decoration:line-through}
.ckbar{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;font:600 .88rem var(--sans);color:var(--link);text-decoration:underline;cursor:pointer}
.fbox{margin:.4rem 0 1rem;padding:.2rem 0}
.fbox h4,.forms-pg details h4{margin:1.1rem 0 .3rem;font:700 .95rem var(--sans);color:var(--tape)}
.fsteps{margin:.2rem 0 0;padding-left:1.4rem;font:400 1rem/1.55 var(--serif)}
.fatt{margin:.2rem 0 0;padding-left:1.3rem;font:400 1rem/1.5 var(--serif)}
.forms-list details{background:var(--page)}
@media (max-width:820px){.steps>li{padding-left:2.6rem}}
.lb-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.6rem;margin:1.2rem 0}
.lb-stats div{background:var(--page);border:1px solid var(--rule);border-radius:4px;padding:.55rem .8rem}
.lb-stats b{display:block;font:700 1.7rem/1.1 var(--serif);color:var(--tape)}
.lb-stats span{font:500 .82rem var(--sans);color:var(--muted)}
.lb-bar{display:flex;flex-direction:column;gap:.15rem;background:var(--page);border:1px solid var(--rule);border-radius:4px;padding:.6rem .8rem;margin-bottom:1.1rem}
.lb-bar button{display:grid;grid-template-columns:13rem 1fr 2rem;gap:.7rem;align-items:center;background:none;border:0;padding:.12rem 0;cursor:pointer;font:400 .86rem var(--sans);color:var(--ink);text-align:left}
.lb-bar button i{display:block;height:.55rem;background:var(--tape);border-radius:2px}
.lb-bar button em{font-style:normal;color:var(--muted);text-align:right}
.lb-bar button:hover span{text-decoration:underline}
.lb-tools{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.7rem}
.lb-tools input{flex:1;min-width:14rem;font:400 1rem var(--sans);padding:.55rem .7rem;border:1px solid var(--rule);border-radius:4px;background:var(--page);color:var(--ink)}
.lb-kind{display:flex}
.lb-kind button,.lb-chips button{font:500 .85rem var(--sans);border:1px solid var(--rule);background:var(--page);color:var(--ink);padding:.35rem .8rem;cursor:pointer}
.lb-kind button:first-child{border-radius:4px 0 0 4px}
.lb-kind button:last-child{border-radius:0 4px 4px 0}
.lb-chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.lb-chips button{border-radius:99px;padding:.2rem .75rem;font-size:.8rem}
.lb-kind button.on,.lb-chips button.on{background:var(--tape);border-color:var(--tape);color:var(--page)}
.lb-tag{font:600 .74rem var(--sans)!important;color:var(--muted)!important}
.lb-tag.pack{color:var(--tape)!important}
.lb-meta{margin:.2rem 0 0}
.lb-tabs{display:flex;gap:.2rem;flex-wrap:wrap;margin:1rem 0 1.2rem;border-bottom:1px solid var(--rule)}
.lb-tabs a{font:500 .92rem var(--sans);padding:.5rem .9rem;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.lb-tabs a.on{color:var(--ink);border-color:var(--tape);font-weight:700}
.lb-time{display:inline-block;margin-left:.6rem;font:500 .78rem var(--sans);color:var(--page);background:var(--muted);border-radius:3px;padding:.05rem .45rem}
.lb-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.6rem;background:var(--page);border:1px solid var(--rule);border-radius:4px;padding:.8rem;margin:.6rem 0}
.lb-form label{display:flex;flex-direction:column;gap:.15rem;font:500 .78rem var(--sans);color:var(--muted)}
.lb-form input{font:400 .95rem var(--sans);padding:.4rem .5rem;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink)}
.lb-act{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.lb-btn{font:600 .85rem var(--sans);border:1px solid var(--rule);background:var(--page);color:var(--ink);border-radius:4px;padding:.45rem .9rem;cursor:pointer}
.lb-btn.pri{background:var(--tape);border-color:var(--tape);color:var(--page)}
.lb-pane{display:grid;grid-template-columns:16rem 1fr;gap:1rem;margin-top:.6rem}
.lb-list{display:flex;flex-direction:column;gap:.3rem;max-height:34rem;overflow:auto}
.lb-list button{text-align:left;font:500 .86rem/1.3 var(--sans);border:1px solid var(--rule);border-left:3px solid var(--rule);background:var(--page);color:var(--ink);padding:.45rem .6rem;cursor:pointer;border-radius:3px}
.lb-list button.on{border-left-color:var(--tape);font-weight:700}
.lb-doc{background:var(--page);border:1px solid var(--rule);border-radius:4px;padding:.9rem 1.1rem;min-width:0}
.lb-doc h2{margin:0 0 .5rem;font-size:1.15rem}
.lb-doc pre{white-space:pre-wrap;word-wrap:break-word;font:400 .92rem/1.6 var(--serif);margin:0 0 .8rem}
.lb-nav{display:flex;justify-content:space-between;gap:1rem;margin-top:1.6rem}
.qd{margin:.6rem 0}
@media (max-width:760px){.lb-pane{grid-template-columns:1fr}
.lb-list{max-height:12rem}
.lb-bar button{grid-template-columns:8rem 1fr 1.6rem}}
.lb-switch{display:flex;gap:.4rem;flex-wrap:wrap;margin:.2rem 0 1rem}
.lb-switch a{font:600 .88rem var(--sans);padding:.4rem .9rem;border:1px solid var(--rule);border-radius:5px;background:var(--page);color:var(--ink);text-decoration:none}
.lb-switch a.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
.lb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.7rem}
.lb-card{display:block;background:var(--page);border:1px solid var(--rule);border-left:4px solid var(--tape);border-radius:5px;padding:.75rem .9rem;text-decoration:none;color:var(--ink)}
.lb-card:hover{border-left-color:var(--lodr)}
.lb-card small{display:block;font:500 .76rem var(--sans);color:var(--muted);margin-bottom:.2rem}
.lb-card h3{margin:0;font:600 1.05rem/1.3 var(--serif)}
.lb-tags{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.45rem}
.lb-tags span,.lb-tagl{font:500 .72rem var(--sans);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:.05rem .4rem;color:var(--ink);text-decoration:none}
.lb-tagrow{display:flex;flex-wrap:wrap;gap:.3rem}
.lb-pane.wide{grid-template-columns:17rem 1fr;align-items:start}
.lb-pane.wide>.lb-list a{display:block;text-decoration:none;font:500 .86rem/1.3 var(--sans);border:1px solid var(--rule);border-left:3px solid var(--rule);background:var(--page);color:var(--ink);padding:.45rem .6rem;border-radius:3px}
.lb-pane.wide>.lb-list a.on{border-left-color:var(--tape);font-weight:700}
.lb-list small{display:block;font:500 .7rem var(--sans);color:var(--muted)}
.lb-doc.wide{max-width:46rem}
.lb-doc h3{margin:1.3rem 0 .4rem;font:700 1.02rem var(--sans);color:var(--tape);border-bottom:1px solid var(--rule);padding-bottom:.2rem}
.lb-doc h1{font-size:1.7rem;margin:.1rem 0 0}
.lb-meta{font:600 .78rem var(--sans);color:var(--muted)}
.lb-back{margin:.2rem 0 .8rem}
.lb-steps{display:flex;flex-direction:column;gap:.6rem}
.lb-step{display:flex;gap:.8rem;border:1px solid var(--rule);border-radius:5px;padding:.7rem .8rem;background:var(--paper)}
.lb-sn{flex:none;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--tape);color:var(--page);font:700 .9rem var(--sans);display:flex;align-items:center;justify-content:center}
.lb-st{font:700 1rem var(--sans)}
.lb-sb p{margin:.25rem 0 0;font:400 1rem/1.55 var(--serif)}
.lb-sf{margin-top:.4rem;font:400 .92rem/1.45 var(--serif)}
.lb-sf b{font:700 .78rem var(--sans);color:var(--muted)}
.lb-sf ul{margin:.15rem 0 0;padding-left:1.2rem}
.note.warn{border-color:var(--warn);color:var(--warn)}
.lb-list small + *{}
.lb-list button small{display:block}
@media (max-width:820px){.lb-pane.wide{grid-template-columns:1fr}
.lb-pane.wide>.lb-list{max-height:11rem}}
@media print{.lb-tabs,.lb-form,.lb-act,.lb-list,.lb-nav,.lb-back,.lb-switch{display:none}}
@media print{.ckbar{display:none}}
.bl{display:inline-block;min-width:4.5rem;border-bottom:2px solid var(--stamp);color:transparent;line-height:1;vertical-align:baseline;user-select:none}
.resol{margin:.4rem 0 0;padding:1.1rem 1.3rem;background:var(--page);border:1px solid var(--rule);border-left:5px solid var(--tape);border-radius:3px;max-width:44rem;font:400 1.04rem/1.7 var(--serif)}

.resol p,.prop p,.mins p{margin:.6rem 0}
.mh{margin:1.4rem 0 .2rem;font:700 1.05rem var(--sans);color:var(--tape)}
.gh{margin:.9rem 0 .1rem;font:600 .95rem var(--sans);color:var(--muted)}
.rl{margin:.4rem 0 0}
.rl summary{font:600 .86rem var(--sans);color:var(--link);cursor:pointer}
.rl ul{margin:.3rem 0 0;padding-left:1.1rem;font:400 .95rem/1.5 var(--serif)}
.ref{margin:.2rem 0 .6rem;padding-left:1.2rem;font:400 .95rem/1.5 var(--serif)}
.cases-home .toc details ul.secs b{min-width:2.2rem}
.part>summary .ch{background:var(--ink);color:var(--page)}
.body{hyphens:manual;text-align:left;line-height:1.8;font-size:calc(1.14rem*var(--fs))}
.p{margin:.95rem 0}
.p.sub{margin-top:1.15rem}

/* ===================== Compliance Lab: design system (v3) ===================== */
:root{
  --paper:#eef1f6;--page:#ffffff;--ink:#142033;--muted:#566377;--rule:#d6dde8;--soft:#e7edf6;
  --tape:#17376a;--link:#1d4f9f;--mark:#ffe9a8;--warn:#a53a24;--lodr:#a8651b;--stamp:#a53a24;
  --bar:#10264a;--barink:#eaf0fa;--gold:#c9a24a;--tip:#142033;--tipink:#f2f6fc;--fs:1;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(16,38,74,.06),0 8px 24px -14px rgba(16,38,74,.28);
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=sepia]{--paper:#e8dfc8;--page:#f8f2e0;--ink:#2a2418;--muted:#655a42;--rule:#d2c6a4;--soft:#efe6cc;--tape:#6b4313;--link:#6b3a0b;--mark:#f5d87a;--warn:#9b2b18;--lodr:#8a4a06;--stamp:#9b2b18;--bar:#3a2a14;--barink:#f6eedb;--gold:#d2a64a;--tip:#2a2418;--tipink:#f6eedb}
:root[data-theme=dark]{color-scheme:dark;--paper:#0b1220;--page:#131d31;--ink:#e6edf8;--muted:#9aabc4;--rule:#26344f;--soft:#1a2740;--tape:#8fb4ff;--link:#8fb4ff;--mark:#4d4310;--warn:#f08a72;--lodr:#f0a04b;--stamp:#f08a72;--bar:#070d19;--barink:#e6edf8;--gold:#e0b84f;--tip:#e6edf8;--tipink:#0b1220;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.7)}
@media (prefers-color-scheme:dark){:root[data-theme=auto]{color-scheme:dark;--paper:#0b1220;--page:#131d31;--ink:#e6edf8;--muted:#9aabc4;--rule:#26344f;--soft:#1a2740;--tape:#8fb4ff;--link:#8fb4ff;--mark:#4d4310;--warn:#f08a72;--lodr:#f0a04b;--stamp:#f08a72;--bar:#070d19;--barink:#e6edf8;--gold:#e0b84f;--tip:#e6edf8;--tipink:#0b1220;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
html{scroll-padding-top:7rem;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--sans)}
a{color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
[hidden]{display:none!important}
kbd{font:600 .75rem var(--sans);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 .35rem;background:var(--page);color:var(--muted)}
.small{font-size:.9rem;color:var(--muted)}
.muted{color:var(--muted)}
.note{margin:.8rem 0;padding:.6rem .9rem;border-left:3px solid var(--gold);background:var(--soft);border-radius:0 6px 6px 0;font:400 .95rem/1.5 var(--sans)}
.msg{max-width:46rem;margin:3rem auto;padding:0 1.25rem;font:400 1.05rem/1.55 var(--serif)}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);z-index:90;background:var(--bar);color:var(--barink);padding:.6rem 1.1rem;border-radius:8px;font:600 .92rem var(--sans);box-shadow:var(--shadow)}

/* ---------- header ---------- */
.bar{position:sticky;top:0;z-index:50;background:var(--bar);border-bottom:3px solid var(--gold)}
.bar-in{max-width:1500px;margin:auto;padding:.5rem 1.25rem;display:flex;align-items:center;gap:1.2rem}
.brand{display:flex;align-items:center;gap:.6rem;font:700 1.1rem/1 var(--sans);color:var(--barink);text-decoration:none;white-space:nowrap}
.brand .mk{display:grid;place-items:center;width:1.85rem;height:1.85rem;border-radius:6px;background:var(--gold);color:#10264a;font:700 1.1rem var(--sans)}
.mainnav{display:flex;gap:.15rem}
.mainnav a{color:var(--barink);opacity:.85;text-decoration:none;font:600 .95rem var(--sans);padding:.5rem .85rem;border-radius:6px}
.mainnav a:hover{opacity:1;background:rgba(255,255,255,.1)}
.mainnav a[aria-current=page]{opacity:1;background:rgba(255,255,255,.16)}
.hs{margin-left:auto;display:flex;align-items:center;gap:.6rem;min-width:0;width:min(26rem,34vw);padding:.5rem .8rem;border:0;border-radius:7px;background:rgba(255,255,255,.13);color:var(--barink);font:500 .92rem var(--sans);white-space:nowrap;overflow:hidden;cursor:pointer;text-align:left}
.hs:hover{background:rgba(255,255,255,.22)}
.hs svg{flex:none;width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:2;opacity:.85}
.hs kbd{margin-left:auto;background:transparent;color:var(--barink);border-color:rgba(255,255,255,.35)}
.aa{position:relative}
.aa>button{background:none;border:1px solid rgba(255,255,255,.3);color:var(--barink);border-radius:6px;height:2.1rem;padding:0 .7rem;font:600 .9rem var(--sans);cursor:pointer}
.aa>button:hover{background:rgba(255,255,255,.12)}
.aamenu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:15rem;background:var(--page);color:var(--ink);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:.8rem}
.aamenu h4{margin:.1rem 0 .4rem;font:600 .8rem var(--sans);color:var(--muted)}
.aamenu .row2{display:flex;gap:.4rem;margin-bottom:.8rem}
.aamenu button{flex:1;border:1px solid var(--rule);background:var(--page);color:var(--ink);border-radius:6px;padding:.4rem;font:600 .88rem var(--sans);cursor:pointer}
.aamenu button[aria-pressed=true]{border-color:var(--tape);box-shadow:inset 0 0 0 1px var(--tape)}
.aamenu .sw[data-t=light]{background:#fff}.aamenu .sw[data-t=sepia]{background:#f3ecd7}.aamenu .sw[data-t=dark]{background:#131d31;color:#e6edf8}
.menubtn{display:none;background:none;border:1px solid rgba(255,255,255,.3);color:var(--barink);border-radius:6px;height:2.1rem;padding:0 .7rem;font:600 .9rem var(--sans);cursor:pointer}
.sub{position:sticky;top:3.35rem;z-index:40;background:var(--page);border-bottom:1px solid var(--rule)}
.sub-in{max-width:1500px;margin:auto;padding:0 1.25rem;display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none}
.sub a{padding:.72rem .9rem;font:600 .92rem var(--sans);color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.sub a:hover{color:var(--ink)}
.sub a[aria-current=page]{color:var(--tape);border-bottom-color:var(--tape)}
:root[data-theme=dark] .sub a[aria-current=page]{color:var(--ink);border-bottom-color:var(--gold)}
.sub .sp{flex:1}
.sub:empty,.sub[hidden]{display:none}

/* ---------- pages ---------- */
.pg,.home{max-width:1180px;margin:0 auto;padding:1.8rem 1.25rem 4rem}
.pg.narrow{max-width:820px}
.crumbs{margin:0 0 .7rem;font:500 .85rem var(--sans);color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--link);text-decoration:underline}
.crumbs i{font-style:normal;margin:0 .35rem;opacity:.6}
.pg h1,.home h1{margin:.1rem 0 .4rem;font:700 clamp(1.7rem,3.4vw,2.35rem)/1.15 var(--sans);letter-spacing:-.015em;color:var(--tape)}
:root[data-theme=dark] .pg h1,:root[data-theme=dark] .home h1{color:var(--ink)}
.lede{max-width:46rem;margin:.2rem 0 1.4rem;font:400 1.1rem/1.55 var(--serif);color:var(--muted)}
.pg h2,.home h2{margin:2rem 0 .8rem;font:700 1.12rem var(--sans);color:var(--ink);padding-bottom:.4rem;border-bottom:1px solid var(--rule)}
.pg h3{margin:1.2rem 0 .4rem;font:700 1rem var(--sans)}
.pg p.note,.pg .note{max-width:50rem}
.pg ul.list{list-style:none;margin:.5rem 0;padding:0;display:grid;gap:.4rem}
.pg ul.list li{display:flex;gap:.8rem;align-items:baseline;background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:.55rem .8rem}
.pg ul.list a{display:flex;gap:.8rem;align-items:baseline;flex:1;text-decoration:none;color:var(--ink)}
.pg ul.list a:hover span{color:var(--link)}
.pg ul.list b{flex:none;min-width:3rem;font:700 1rem var(--sans);color:var(--tape)}
.pg ul.list small{display:block;color:var(--muted);font:400 .85rem var(--sans)}
.pg ul.list .x{border:0;background:none;color:var(--warn);cursor:pointer;font:600 .85rem var(--sans)}
.box{background:var(--page);border:1px solid var(--rule);border-radius:10px;padding:1rem 1.1rem;box-shadow:var(--shadow)}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:end;margin:.6rem 0}
.row label{display:flex;flex-direction:column;gap:.2rem;font:600 .88rem var(--sans);flex:1;min-width:12rem}
.row input,.row select,.pg textarea,.lb-form input{font:400 1rem var(--sans);padding:.5rem .65rem;border:1px solid var(--rule);border-radius:7px;background:var(--page);color:var(--ink);width:100%}
.btn{display:inline-block;font:600 .92rem var(--sans);padding:.5rem 1rem;border:1px solid var(--tape);background:var(--page);color:var(--tape);border-radius:7px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.pri,.btn.main{background:var(--tape);color:var(--page)}
.btnrow{display:flex;gap:.6rem;flex-wrap:wrap;margin:.7rem 0}
:root[data-theme=dark] .btn{border-color:var(--rule);color:var(--ink)}

/* filter / inline fields */

/* ---------- search palette ---------- */

/* ---------- home ---------- */
.hero{background:linear-gradient(180deg,var(--bar),color-mix(in srgb,var(--bar) 82%,#000));color:var(--barink);border-bottom:3px solid var(--gold)}

.herosearch{display:flex;align-items:center;gap:.8rem;width:min(40rem,100%);padding:.95rem 1.1rem;border:0;border-radius:11px;background:var(--page);color:var(--muted);font:500 1.08rem var(--sans);text-align:left;cursor:pointer;box-shadow:0 14px 30px -14px rgba(0,0,0,.6)}

/* ---------- contents lists (Act, LODR, cases, resolutions) ---------- */

:root[data-theme=dark] .secs b{color:var(--link)}

/* ---------- reader: contents rail | text | context panel ---------- */
.reader{max-width:1560px;margin:0 auto;padding:1.4rem 1.25rem 4rem;display:grid;grid-template-columns:17.5rem minmax(0,44rem) minmax(21rem,1fr);gap:1.6rem;align-items:start}
.margin{position:sticky;top:7.4rem;max-height:calc(100vh - 8.4rem);overflow:auto;background:var(--page);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);scrollbar-width:thin}
.rail-top{padding:.9rem 1rem .6rem;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--page);z-index:2}
.rail-top h3{margin:0 0 .45rem;font:700 .95rem var(--sans)}
.rail-top input{width:100%;font:400 .9rem var(--sans);padding:.4rem .6rem;border:1px solid var(--rule);border-radius:7px;background:var(--paper);color:var(--ink)}
.rail-list{padding:.3rem 0 .8rem}
.rail-ch{margin:0}
.rail-ch>summary{list-style:none;cursor:pointer;display:flex;gap:.55rem;align-items:baseline;padding:.4rem 1rem;font:600 .8rem/1.3 var(--sans);color:var(--muted)}

.rail-sec{display:flex;gap:.6rem;align-items:baseline;padding:.3rem 1rem .3rem 1.2rem;border-left:3px solid transparent;color:var(--ink);text-decoration:none;font:400 .86rem/1.35 var(--sans)}

.rail-sec:hover{background:var(--soft)}
.rail-sec[aria-current=page]{background:var(--soft);border-left-color:var(--tape);font-weight:600}

:root[data-theme=dark] .rail-sec[aria-current=page] b{color:var(--link)}
.rail-sec.om{opacity:.55}
.rail-info{padding:.9rem 1rem;border-bottom:1px solid var(--rule);font:400 .88rem/1.45 var(--sans)}

.railbtn{display:none}
.text{position:relative;min-width:0;background:var(--page);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:clamp(1.2rem,2.6vw,2.2rem) clamp(1.2rem,3vw,2.6rem) 2rem}
.sechead{display:flex;gap:1rem;align-items:flex-start;margin:.2rem 0 1.1rem;padding-bottom:1rem;border-bottom:1px solid var(--rule)}
.secnum{flex:none;display:grid;place-items:center;min-width:3.6rem;height:3.6rem;padding:0 .6rem;border-radius:10px;background:var(--tape);color:var(--page);font:700 1.45rem var(--sans);letter-spacing:-.01em;font-variant-numeric:tabular-nums}

.sechead h1,.text h1{margin:0;font:600 clamp(1.5rem,2.6vw,2rem)/1.2 var(--serif);letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.text h1:focus{outline:0}
.sechead .kicker{display:block;margin-bottom:.15rem;font:600 .78rem var(--sans);color:var(--muted)}
.badge{display:inline-block;margin:.3rem 0;padding:.1rem .6rem;border-radius:99px;background:var(--soft);font:600 .78rem var(--sans);color:var(--muted)}
.stool{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 1rem}
.stool button{border:1px solid var(--rule);background:var(--page);border-radius:7px;padding:.28rem .7rem;font:600 .82rem var(--sans);color:var(--muted);cursor:pointer}
.stool button:hover{color:var(--ink);border-color:var(--muted)}
.stool button[aria-pressed=true]{background:var(--soft);color:var(--tape);border-color:var(--tape)}
.side{position:sticky;top:7.4rem;max-height:calc(100vh - 8.4rem);overflow:auto;background:var(--page);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:0 1.2rem 1.4rem;scrollbar-width:thin}
.tabs{position:sticky;top:0;z-index:2;display:flex;gap:.2rem;align-items:center;margin:0 -1.2rem 1rem;padding:.6rem 1.2rem 0;background:var(--page);border-bottom:1px solid var(--rule)}
.tabs button,.mtabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:.5rem .8rem;font:600 .92rem var(--sans);color:var(--muted);cursor:pointer}

.tabs .wide{margin-left:auto;margin-bottom:.35rem;border:1px solid var(--rule);border-radius:99px;padding:.15rem .8rem;font:500 .82rem var(--sans);color:var(--ink)}

.mtabs{display:none;gap:.2rem;border-bottom:1px solid var(--rule);margin:0 0 1rem;grid-column:1/-1}

.reader:not([data-tab=deep]) .panel[data-p=deep],.reader[data-tab=deep] .panel[data-p=rules]{display:none}

@media (min-width:1101px){

}

/* ---------- workspace ---------- */

.wk-item b{display:block;font:600 1rem/1.3 var(--sans)}

.wk-tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.7rem}
.wk-task{display:flex;flex-direction:column;gap:.2rem;text-align:left;background:var(--page);border:1px solid var(--rule);border-left:4px solid var(--gold);border-radius:9px;padding:.75rem .9rem;cursor:pointer;box-shadow:var(--shadow)}

.wk-task span{font:400 .86rem/1.4 var(--sans);color:var(--muted)}

/* ---------- rules browser ---------- */

/* ---------- misc ---------- */
.tw{overflow-x:auto}

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const S = { idx:null, map:{}, order:[], ft:null, ftKeys:[], defs:null, defRe:null, cache:new Map(), cur:null, tab:"section", token:0 };

const getJSON = url => {
  if (!S.cache.has(url)) S.cache.set(url, fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(e => { S.cache.delete(url); throw e; }));

};

/* ---------- reading settings ---------- */
function applyPrefs() {
  const root = document.documentElement;
  const t = store.get("theme") || "auto";
  root.dataset.theme = t;
  $$(".sw").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
  const fs = parseFloat(store.get("fs") || "1");
  root.style.setProperty("--fs", isFinite(fs) ? fs : 1);
}
document.addEventListener("click", e => {
  const sw = e.target.closest(".sw");
  if (sw) { store.set("theme", sw.dataset.t); applyPrefs(); }
  const fb = e.target.closest("[data-fs]");
  if (fb) { const cur = parseFloat(store.get("fs") || "1"); store.set("fs", String(Math.min(1.45, Math.max(.85, +(cur + fb.dataset.fs * .08).toFixed(2))))); applyPrefs(); }
});

const parseRef = q => {
  const m = q.trim().match(/^(?:s\.?|sec\.?|section)?\s*(\d{1,3}[a-z]{0,2})((?:\s*\(\s*[^)]{1,6}\s*\))*)$/i);
  if (!m) return null;
  const sub = (m[2].match(/\(\s*([^)]{1,6}?)\s*\)/) || [])[1];
  return { n: m[1].toUpperCase(), sub };
};
const secRow = n => S.idx.sections[S.map[n]];
const secItem = (n, sub) => {
  const r = secRow(n);
  const where = r[2] ? `Chapter ${esc(r[2])}, ${esc(nice(r[3]))}` : "";
  const extra = r[5] ? `${where ? ", " : ""}${r[5]} ${r[5] === 1 ? "rule" : "rules"}` : "";
  return { href: `#/s/${n}${sub ? "?sub=" + encodeURIComponent(sub) : ""}`,
    html: `<a class="res" role="option" href="#/s/${n}${sub ? "?sub=" + encodeURIComponent(sub) : ""}"><b>${esc(n)}</b><span class="rt">${esc(r[1])}${r[4] ? " (omitted)" : ""}<small>${where}${extra}</small></span></a>` };
};
/* ---------- text rendering ---------- */
const REF = /\b(sections?|sub-sections?)(\s+)(\d{1,3}[A-Z]{0,2}(?:\([0-9A-Za-z]{1,4}\))*(?:\s*(?:,|and|or|to)\s*\d{1,3}[A-Z]{0,2}(?:\([0-9A-Za-z]{1,4}\))*)*)/g;
function linkRefs(h) {
  return h.replace(REF, (m, w, sp, list, off) => {
    const after = h.slice(off + m.length, off + m.length + 100);
    const o = after.match(/^\s*(?:of|under)\s+(?:the\s+)?([A-Z][A-Za-z’' ()\-]{2,70}?)\s*\b(?:Act|Code)\b/);
    if (o && !/^Companies/.test(o[1].trim())) return m;
    return w + sp + list.replace(/(\d{1,3}[A-Z]{0,2})((?:\([0-9A-Za-z]{1,4}\))*)/g, (x, n, subs) => {
      if (S.map[n] === undefined) return x;
      const s1 = (subs.match(/\(([0-9A-Za-z]{1,4})\)/) || [])[1];
      return `<a href="#/s/${n}${s1 ? "?sub=" + s1 : ""}">${n}${subs}</a>`;
    });
  });
}
function markDefs(h, seen) {

}
function para(p, ctx) {

  if (ctx.seen) h = markDefs(h, ctx.seen);
  const lab = p.l ? `<span class="lbl">${esc(p.l)}</span>` : "";
  let badge = "";
  if (ctx.counts) {
    if (p.k === "sub") ctx.cur = p.l.replace(/[()]/g, ""); else if (p.k === "p") ctx.cur = "";
    const c = p.k === "sub" ? ctx.counts[ctx.cur] : 0;
    if (c) badge = `<button class="rb" data-sub="${esc(ctx.cur)}" aria-pressed="false" title="Rules that cite sub-section ${esc(p.l)}">${c} ${c === 1 ? "rule" : "rules"}</button>`;
  }
  return `<p class="p ${p.k}"${p.l ? ` data-l="${esc(p.l)}"` : ""}${ctx.counts ? ` data-sub="${esc(ctx.cur || "")}"` : ""}>${badge}${lab}${h}</p>`;
}

/* ---------- views ---------- */
const KEEP = { sub: 1 };
function subCounts(d) {
  const c = {};
  d.rules.filter(r => r.conf !== "low").forEach(r => (r.sb || []).forEach(x => { c[x] = (c[x] || 0) + 1; }));
  return c;
}
function rulesPanel(d, sub) {
  const all = d.rules, direct = all.filter(r => r.conf !== "low"), low = all.filter(r => r.conf === "low");
  const item = r => `<li><details data-set="${r.set}" data-rule="${esc(r.rule)}" data-ps='${JSON.stringify(r.ps || [])}'><summary><span class="rn">Rule ${esc(r.rule)}</span><span class="rt">${esc(r.t || "No heading")}</span>${r.conf === "medium" ? `<span class="flag" title="This rule mentions the section but does not say which Act. Read it to confirm.">verify</span>` : ""}</summary><div class="rbody"></div></details></li>`;
  const sets = list => { const m = new Map(); list.forEach(r => { if (!m.has(r.set)) m.set(r.set, []); m.get(r.set).push(r); });
    return [...m].map(([k, arr]) => `<section class="set"><h3>${esc(S.idx.sets[k].name)}</h3><ul class="rl">${arr.map(item).join("")}</ul></section>`).join(""); };
  const counts = subCounts(d), keys = Object.keys(counts).sort((x, y) => parseInt(x) - parseInt(y) || x.localeCompare(y));
  const whole = direct.filter(r => !(r.sb || []).length);
  let h = "";
  if (keys.length) h += `<div class="chips" role="group" aria-label="Narrow the rules to a sub-section"><button data-sub="" aria-pressed="${!sub}">All (${direct.length})</button>${keys.map(k => `<button data-sub="${esc(k)}" aria-pressed="${sub === k}">(${esc(k)})<span>${counts[k]}</span></button>`).join("")}</div>`;
  if (sub) {
    const spec = direct.filter(r => (r.sb || []).includes(sub));
    h += spec.length ? `<p class="small">${spec.length} ${spec.length === 1 ? "rule cites" : "rules cite"} sub-section (${esc(sub)}) of section ${esc(d.n)}.</p>${sets(spec)}`
                     : `<p class="small">No rule names sub-section (${esc(sub)}). The rules below cite the section as a whole.</p>`;
    if (whole.length) h += `<details class="lowgroup"${spec.length ? "" : " open"}><summary>Rules that cite the whole section (${whole.length})</summary>${sets(whole)}</details>`;
  } else if (direct.length) {
    h += `<p class="small">${direct.length} ${direct.length === 1 ? "rule refers" : "rules refer"} to section ${esc(d.n)}.${keys.length ? " Pick a sub-section above to narrow them." : ""}</p>` + sets(direct);
  }
  if (low.length) h += `<details class="lowgroup"${direct.length ? "" : " open"}><summary>Other rules made under this section (${low.length})</summary><p class="small">These rules do not name the section. Their rule set says it was made under section ${esc(d.n)}.</p>${sets(low)}</details>`;
  if (!h) h = `<p class="empty">No rules are linked to section ${esc(d.n)}. Many sections have none.</p>`;
  return h;
}
function setSub(sub, scroll) {
  const d = S.d, rd = $(".reader"); if (!d || !rd) return;
  S.sub = sub || "";
  $('.panel[data-p="rules"]', rd).innerHTML = rulesPanel(d, S.sub);
  $$(".p[data-sub]", rd).forEach(p => p.classList.toggle("sel", !!S.sub && p.dataset.sub === S.sub));
  $$(".rb", rd).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sub === S.sub)));
  history.replaceState(null, "", `#/s/${d.n}${S.sub ? "?sub=" + encodeURIComponent(S.sub) : ""}`);

}
document.addEventListener("click", e => {
  const c = e.target.closest(".chips button, .rb"), l = e.target.closest(".p.sub .lbl");
  if (!c && !l) return;
  let sub = c ? c.dataset.sub : l.closest(".p").dataset.sub;
  if ((c && c.classList.contains("rb") || l) && sub === S.sub) sub = "";
  setSub(sub, !!(c && c.closest(".chips")));
  if (matchMedia("(max-width:820px)").matches && !(c && c.closest(".chips"))) { setTab("rules"); window.scrollTo(0, 0); }
  else if (!c || !c.closest(".chips")) setTab("rules");
});
function setTab(t) {
  S.tab = t; const rd = $(".reader"); if (!rd) return;
  rd.dataset.tab = t;
  $$("[role=tab]", rd).forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t || (t === "section" && b.dataset.tab === "rules" && !!b.closest(".tabs")))));
  if (t === "deep") { if (rd.dataset.k === "lodr" || rd.dataset.k === "case" || rd.dataset.k === "rule") { if (S.lodrBuild) S.lodrBuild(); } else buildWeb(); }
}
document.addEventListener("click", e => { const b = e.target.closest("[role=tab][data-tab]"); if (b) { setTab(b.dataset.tab); if (b.closest(".mtabs")) window.scrollTo(0, 0); } });
/* show only the paragraphs of a rule that refer to this section (and the chosen sub-section) */
function ruleView(det) {
  const body = $(".rbody", det), btn = $(".more", body); if (!btn) return;
  let ps = []; try { ps = JSON.parse(det.dataset.ps || "[]"); } catch (e) {}
  const want = new Set(ps.filter(x => !S.sub || x[1] === S.sub).map(x => x[0]));
  const paras = $$(".p[data-i]", body), full = det.dataset.full === "1", other = paras.length - want.size;
  paras.forEach(el => { const hit = want.has(+el.dataset.i); el.classList.toggle("hit", want.size > 0 && hit); el.hidden = want.size > 0 && !full && !hit; });
  btn.hidden = !(want.size > 0 && other > 0);
  btn.textContent = full ? "Show only the part that cites this section" : `Show the whole rule (${other} more ${other === 1 ? "paragraph" : "paragraphs"})`;
}
document.addEventListener("click", e => { const b = e.target.closest(".more"); if (!b) return; const det = b.closest("details[data-set]"); det.dataset.full = det.dataset.full === "1" ? "" : "1"; ruleView(det); });
document.addEventListener("toggle", async e => {
  const d = e.target; if (!d.open || !d.dataset || d.dataset.set === undefined) return;
  const body = $(".rbody", d); if (body.dataset.done) return;
  body.innerHTML = `<p class="small">Loading…</p>`;
  try {
    const set = await getJSON(`data/r/${d.dataset.set}.json`); const r = set.rules[d.dataset.rule];
    const ctx = {};
    body.innerHTML = `<button class="more" hidden></button>` + (r.paras.map((p, i) => para(p, ctx).replace("<p ", `<p data-i="${i}" `)).join("") || `<p class="small">No text was found for this rule.</p>`)
      + (r.notes.length ? `<details class="notes"><summary>Amendment notes (${r.notes.length})</summary><ol>${r.notes.map(x => `<li>${esc(x)}</li>`).join("")}</ol></details>` : "");
    body.dataset.done = "1"; ruleView(d);
    if (S.idx.sets[d.dataset.set].ai) getJSON(`data/ai/r/${d.dataset.set}.json`).then(ai => { const e = ai[d.dataset.rule];
      if (e && !$(".aibox", body)) body.insertAdjacentHTML("afterbegin", `<details class="aibox"><summary>Explain this rule in simple words</summary>${aiHTML(e, "rule")}</details>`); }).catch(() => {});

}, true);


/* ---------- the web: how a section connects to other sections and to rules ----------
   Groups are the first ring (sections it cites, sections that cite it, one per set of Rules);
   their members are the second ring. A later group for another law (SEBI LODR) is one more entry in webGroups(). */
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
/* A one-sentence explanation of a link, chosen from the wording around the citation. */
const REL = [["def", /meaning (?:assigned|given)|defined (?:in|under)|as defined|same meanings?/i], ["not", /notwithstanding/i], ["sub", /subject to/i],

const relOf = x => (REL.find(([, re]) => re.test(x || "")) || ["ref"])[0];
const ttl = n => { const r = S.idx.sections[S.map[n]]; return r ? nice(r[1]) : ""; };
const OUT_SAY = { def: m => `Uses a term whose meaning is given in section ${m}, “${ttl(m)}”.`, not: m => `Applies even where section ${m}, “${ttl(m)}”, says otherwise.`,
  sub: m => `Is made subject to section ${m}, “${ttl(m)}”.`, cmp: m => `Requires compliance with section ${m}, “${ttl(m)}”.`,
  pen: m => `Ties into the offence, penalty or liability dealt with in section ${m}, “${ttl(m)}”.`, pro: m => `Draws on the power or procedure in section ${m}, “${ttl(m)}”.`,
  ref: m => `Refers to section ${m}, “${ttl(m)}”, which deals with a related matter.` };
const IN_SAY = { def: m => `Section ${m}, “${ttl(m)}”, uses a term that this section defines.`, not: m => `Section ${m}, “${ttl(m)}”, applies even where this section says otherwise.`,
  sub: m => `Section ${m}, “${ttl(m)}”, is made subject to this section.`, cmp: m => `Section ${m}, “${ttl(m)}”, requires compliance with this section.`,
  pen: m => `Section ${m}, “${ttl(m)}”, ties into the offence, penalty or liability dealt with here.`, pro: m => `Section ${m}, “${ttl(m)}”, draws on the power or procedure in this section.`,
  ref: m => `Section ${m}, “${ttl(m)}”, refers to this section for a related matter.` };
function lodrLabel(id) { return /^S/.test(id) ? id : "R" + id; }
function lodrTip(id, t) { return /^S/.test(id) ? `SEBI (LODR) Schedule ${id.slice(1)}${t ? ". " + t : ""}` : `SEBI (LODR) Regulation ${id}${t ? ". " + t : ""}`; }
function lodrGroups(d) {
  const L = S.lodrT || {}, g = [];
  const reg = (id, why, q, extra) => ({ k: "s", reg: true, id, label: lodrLabel(id), why, q: q || "", tip: lodrTip(id, L[id]), href: `#/lodr/${encodeURIComponent(id)}`, ...extra });
  const act = (a, why, extra) => ({ k: "s", id: a.n, label: a.n, why, q: a.w === "c" ? a.x : "", tip: `Section ${a.n}${a.t ? ". " + a.t : ""}`, href: `#/s/${a.n}`, ...extra });
  if (d.out && d.out.length) g.push({ kind: "out", label: `Refers to ${plural(d.out.length, "provision")}`, items: d.out.map(id => reg(id, `This ${d.sch ? "schedule" : "regulation"} refers to ${/^S/.test(id) ? "Schedule " + id.slice(1) : "regulation " + id}.`, (d.wo || {})[id])) });
  if (d.in && d.in.length) g.push({ kind: "in", label: `Referred to by ${plural(d.in.length, "provision")}`, items: d.in.map(id => reg(id, `${/^S/.test(id) ? "Schedule " + id.slice(1) : "Regulation " + id} refers to this ${d.sch ? "schedule" : "regulation"}.`, (d.wi || {})[id])) });
  const cite = (d.acts || []).filter(a => a.w === "c"), rel = (d.acts || []).filter(a => a.w === "r");
  if (cite.length) g.push({ kind: "rule", label: `Companies Act, named (${cite.length})`, items: cite.map(a => act(a, `This ${d.sch ? "schedule" : "regulation"} names section ${a.n} of the Companies Act, 2013.`)) });
  if (rel.length) g.push({ kind: "co", label: `Companies Act, same subject (${rel.length})`, items: rel.map(a => act(a, `The headings share the words “${a.x}”. Matched by the tool on the headings only. Read both before relying on it.`, { co: true })) });
  return g;

/* ---------- section pack: chosen sections with their Rules and your notes, to print or save as a Word file ---------- */
const packKey = k => (S.idx.sets[k] ? S.idx.sets[k].name : "Rules");
async function buildPack(o) {
  const secs = o.secs, parts = [], toc = [];
  const data = await Promise.all(secs.map(n => getJSON(`data/s/${n}.json`)));
  const needSets = new Set(); if (o.rules === "cited") data.forEach(d => d.rules.filter(r => r.conf !== "low").forEach(r => needSets.add(r.set)));
  const sets = {}; await Promise.all([...needSets].map(async k => { sets[k] = (await getJSON(`data/r/${k}.json`)).rules; }));
  const para = (p, cls) => `<p class="pk-${p.k}"${cls}>${p.l ? `<span>${esc(p.l)}</span>&nbsp;&nbsp;` : ""}${esc(p.x)}</p>`;
  data.forEach((d, i) => {
    toc.push(`<li>Section ${esc(d.n)}. ${esc(d.t)}</li>`);
    let h = `<h2${i === 0 ? ' class="first"' : ""}>Section ${esc(d.n)}. ${esc(d.t)}</h2><p class="sub">${d.c ? `Chapter ${esc(d.c)}, ${esc(nice(d.ct))}` : ""}</p>`;
    h += d.s === "omitted" ? `<p><i>${esc(d.paras.map(p => p.x).join(" ") || "This section has been omitted.")}</i></p>` : d.paras.map(p => para(p, "")).join("");
    const direct = d.rules.filter(r => r.conf !== "low");
    if (o.rules !== "none" && direct.length) {
      h += `<h3>Rules made under this section</h3>`;
      direct.forEach(r => {
        h += `<h4>Rule ${esc(r.rule)}. ${esc(r.t || "")} <span class="sub">(${esc(packKey(r.set))})</span></h4>`;
        if (o.rules === "cited") {
          const rp = sets[r.set] && sets[r.set][r.rule], idx = [...new Set((r.ps || []).map(x => x[0]))].sort((a, b) => a - b);
          if (rp && idx.length) h += idx.map(k => rp.paras[k]).filter(Boolean).map(p => para(p, "")).join("");
        }
      });
    }
    if (o.notes && WS.get().notes[d.n]) h += `<h3>My notes</h3><p class="pk-note">${esc(WS.get().notes[d.n])}</p>`;
    parts.push(h);
  });
  const date = new Date().toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
  const head = `<h1>${esc(o.title)}</h1><p class="sub">Prepared on ${esc(date)} from the Companies Act, 2013 Reader (text built on ${esc(S.idx.built)}). For study only; check the wording against the official gazette or India Code before relying on it.</p>
    <p><b>Contents</b></p><ol class="toc2">${toc.join("")}</ol>`;
  return { title: o.title, html: head + parts.join("") };
}
function packOptions() {
  const raw = ($("#pk-secs").value || "").toUpperCase().split(/[\s,;]+/).filter(Boolean), seen = new Set(), bad = [], secs = [];
  raw.forEach(x => { const n = x.replace(/^S(?:EC(?:TION)?)?\.?/, ""); if (S.map[n] === undefined) bad.push(x); else if (!seen.has(n)) { seen.add(n); secs.push(n); } });
  return { secs, bad, rules: $("#pk-rules").value, notes: $("#pk-notes").checked, title: $("#pk-title").value.trim() || "Companies Act, 2013: selected sections" };
}
async function packRun(kind) {
  const o = packOptions(), msg = $("#pk-msg");
  if (o.bad.length) { msg.textContent = `There is no section ${o.bad.join(", ")} in the Act.`; return; }
  if (!o.secs.length) { msg.textContent = "Add at least one section number."; return; }
  if (o.secs.length > 60) { msg.textContent = "Please keep a pack to 60 sections or fewer."; return; }
  msg.textContent = "Preparing the pack\u2026";
  let pk; try { pk = await buildPack(o); } catch (e) { msg.textContent = "Could not prepare the pack. Check your connection and try again."; return; }
  msg.textContent = "";
  if (kind === "word") {
    const css = `body{font-family:"Times New Roman",serif;font-size:12pt;line-height:1.4}h1{font-size:22pt}h2{font-size:16pt;page-break-before:always;border-top:1.5pt solid #000;padding-top:6pt}h2.first{page-break-before:avoid}h3{font-size:12pt;font-family:Arial,sans-serif}h4{font-size:12pt;margin-bottom:2pt}.sub{color:#555;font-family:Arial,sans-serif;font-size:10pt}p{margin:0 0 6pt}.pk-clause{margin-left:28pt}.pk-subclause{margin-left:56pt}.pk-proviso,.pk-expl{margin-left:28pt;font-size:11pt}.pk-note{border-left:3pt solid #1d4f91;padding-left:8pt;font-family:Arial,sans-serif;font-size:10.5pt}`;
    const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(pk.title)}</title><style>${css}
</style></head><body>${pk.html}</body></html>`;
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff", doc], { type: "application/msword" }));
    a.download = pk.title.replace(/[\\/:*?"<>|]+/g, " ").trim().slice(0, 80) + ".doc"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Word file downloaded");
  } else {
    S.pack = pk; location.hash = "#/tools/pack";
  }
}
function showPack() {
  if (!S.pack) { location.hash = "#/saved"; return; }
  S.cur = null; S.d = null; S.token++; setChrome(false); navMark("me"); document.title = S.pack.title + " | Companies Act, 2013 Reader";
  show(`<section class="pg"><div class="btnrow noprint"><a class="btn" href="#/saved">\u2190 Back to Saved and notes</a><button class="btn" type="button" id="pk-print">Print or save as PDF</button></div><article class="packdoc">${S.pack.html}</article></section>`);

      <aside class="margin"><div class="secnum">${set.n}</div><div class="chap">Rules</div><div class="chapt">${esc(shortSet(set.name))}</div></aside>
      <div class="text"><h1 tabindex="-1">${esc(set.name)}</h1>
        <p class="lede" style="font-size:1.05rem">${plur(set.n, "rule")}. Choose a rule to read it in full.</p>
        <ul class="secs" style="padding:0;grid-template-columns:1fr">${order.map(r => `<li><a href="#/rules/${k}/${encodeURIComponent(r[1])}"><b>${esc(r[1])}</b><span>${esc(r[2] || "Rule " + r[1])}</span></a></li>`).join("")}</ul></div>
      <aside class="side"><div class="tabs" role="tablist"><button role="tab" data-tab="rules">Made under</button></div>
        <div class="panel" data-p="rules"><h3>Made under the Companies Act, 2013</h3>${en.length ? `<ul class="ll">${en.map(n => `<li>${secLink(n)}${S.map[n] !== undefined ? " " + esc(nice(secRow(n)[1])) : ""}</li>`).join("")}</ul>` : `<p class="small">The enabling sections are not listed for this set.</p>`}</div></aside></article>`);
    setTab("section"); return window.scrollTo(0, 0);
  }
  const r = D.rules[rno];
  if (!r) return showMessage(`<p>There is no rule ${esc(rno)} in these Rules. <a href="#/rules/${k}">See the whole set</a>.</p>`);
  const i = order.findIndex(x => x[1] === rno), prev = order[i - 1], next = order[i + 1];
  document.title = `Rule ${rno}. ${r.t || ""} | ${shortSet(set.name)}`;
  const ctx = {};
  const notes = r.notes && r.notes.length ? `<details class="notes"><summary>Amendment notes (${r.notes.length})</summary><ol>${r.notes.map(x => `<li>${esc(x)}</li>`).join("")}</ol></details>` : "";
  const nav = `<nav class="pn" aria-label="Neighbouring rules">${prev ? `<a href="#/rules/${k}/${encodeURIComponent(prev[1])}" rel="prev"><span>Previous rule</span><b>${esc(prev[1])}</b>${esc(prev[2] || "")}</a>` : "<span></span>"}${next ? `<a class="nx" href="#/rules/${k}/${encodeURIComponent(next[1])}" rel="next"><span>Next rule</span><b>${esc(next[1])}</b>${esc(next[2] || "")}</a>` : ""}</nav>`;
  const cites = (r.c || []).filter(n => S.map[n] !== undefined);
  show(`<article class="reader" data-k="rule" data-tab="section" data-wide="0">
    <div class="mtabs" role="tablist"><button role="tab" data-tab="section">Rule</button><button role="tab" data-tab="rules">Sections<span class="count">${cites.length + en.length}</span></button><button role="tab" data-tab="deep">In simple words</button></div>
    <aside class="margin"><div class="secnum">${esc(rno)}</div><div class="chap">Rule ${esc(rno)}</div><div class="chapt">${esc(shortSet(set.name))}</div></aside>
    <div class="text"><h1 tabindex="-1">${esc(r.t || "Rule " + rno)}</h1>
      <div class="stool"><button type="button" data-ract="copy">Copy text</button><button type="button" data-ract="print">Print</button></div>
      <div class="body">${r.paras.map(p => para(p, ctx)).join("") || `<p class="small">No text was found for this rule.</p>`}</div>${notes}${nav}</div>
    <aside class="side" aria-label="Sections and explanation">
      <div class="tabs" role="tablist"><button role="tab" data-tab="rules">Sections<span class="count">${cites.length + en.length}</span></button><button role="tab" data-tab="deep">In simple words</button></div>
      <div class="panel" data-p="rules">
        ${cites.length ? `<h3>Sections of the Act this rule names</h3><ul class="ll">${cites.map(n => `<li>${secLink(n)} ${esc(nice(secRow(n)[1]))}</li>`).join("")}</ul>` : `<p class="small">This rule does not name a section of the Act.</p>`}
        ${en.length ? `<h3>This set is made under</h3><p class="chipline">${en.map(n => S.map[n] !== undefined ? `<a href="#/s/${esc(n)}">${esc(n)}</a>` : `<span>${esc(n)}</span>`).join("")}</p>` : ""}
        <p class="small"><a href="#/rules/${k}">All rules in this set</a></p></div>
      <div class="panel" data-p="deep"><div class="ai" id="aibox"><h3>In simple words</h3><p class="small">Loading…</p></div></div></aside></article>`);
  S.lodrBuild = async () => {
    const box = $("#aibox"); if (!box || box.dataset.done) return; box.dataset.done = "1";
    if (!set.ai) { box.innerHTML = `<h3>In simple words</h3><p class="small">An explanation of this rule in simple words is not ready yet. They are written automatically in the background.</p>`; return; }
    try { const ai = await getJSON(`data/ai/r/${k}.json`), e = ai[rno]; box.innerHTML = `<h3>In simple words</h3>` + (e ? aiHTML(e, "rule") : `<p class="small">An explanation of this rule is not ready yet.</p>`); } catch (er) { box.innerHTML = ""; }
  };
  setTab("section");
  window.scrollTo(0, 0); $("h1").focus({ preventScroll: true });
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-ract]"); if (!b) return; const t = $(".reader .body");
  if (b.dataset.ract === "print") window.print(); else toast(await copyText($$("p", t).map(x => x.textContent).join("\n")) ? "Rule text copied" : "Could not copy");
});

/* ---------- Workspace: one place to start any task ---------- */
const WT_LABEL = { proc: "Processes", res: "Resolutions", draft: "Drafts", gen: "Generators", form: "E-forms" };
const WT_TEXT = {
  proc: ["Processes", "Step-by-step guides and packs for a whole job, with forms, time limits and drafts."],
  res: ["Resolutions", "Model wording for Board, committee and general meetings, with minutes."],
  draft: ["Drafts", "Court and legal drafts: affidavits, notices, agreements and applications."],
  gen: ["Generators", "Fill in a few fields and download the finished document."],
  form: ["E-forms", "Every form named in the Rules, with its filing steps and checklist."]
};
const WT_PATH = { proc: "processes", res: "resolutions", draft: "drafts", gen: "generators", form: "forms" };
function workCard(i) { return `<a class="wcard" href="${esc(i.href)}"><i>${esc(i.tag)}</i><b>${esc(i.t)}</b>${i.d ? `<span>${esc(String(i.d).slice(0, 130))}</span>` : ""}</a>`; }

async function showWork(q) {
  const my = ++S.token; S.cur = null; S.d = null; S.lodrBuild = null; setArea("/work"); setChrome(); document.title = "Workspace | Compliance Lab";
  show(`<section class="pg">${crumbs([["Home", "#/"], ["Workspace", ""]])}<h1>Workspace</h1><p class="msg" style="padding:0">Loading…</p></section>`);
  const W = await workItems(); if (my !== S.token) return;
  const type = q.get("t") || "", text = q.get("q") || "", by = {}; W.forEach(i => (by[i.type] = by[i.type] || []).push(i));
  const hits = workFilter(W, text, type);
  const tabs = WTYPES.map(([k, l]) => `<a href="#/work?${new URLSearchParams({ ...(text ? { q: text } : {}), ...(k ? { t: k } : {}) })}" class="${k === type ? "on" : ""}">${l}<small>${k ? (by[k] || []).length : W.length}</small></a>`).join("");
  const launch = Object.keys(WT_TEXT).filter(k => by[k]).map(k => `<a class="wl" href="#/work/${WT_PATH[k]}"><b>${WT_TEXT[k][0]}</b><span>${WT_TEXT[k][1]}</span><i>${by[k].length}</i></a>`).join("");
  show(`<section class="pg wk">${crumbs([["Home", "#/"], ["Workspace", ""]])}<h1>Workspace</h1>
    <p class="lede">Start any task from here. Pick a process, a model resolution, a draft or a generator, fill in the details once and download the result.</p>
    <div class="find"><div class="field"><span class="sym" aria-hidden="true">${IC_SEARCH}</span><input id="wq" type="search" value="${esc(text)}" placeholder="What do you need to do? For example: change registered office, MGT-14, affidavit" autocomplete="off" spellcheck="false" aria-label="Search the Workspace"></div></div>
    ${text || type ? "" : `<div class="wlaunch">${launch}</div>`}
    <nav class="wtabs" aria-label="Kind of task">${tabs}</nav>
    <div id="wres">${wkList(hits, text, type)}</div></section>`);
  const inp = $("#wq"); let t = null;
  inp.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { const p = new URLSearchParams(); if (inp.value.trim()) p.set("q", inp.value.trim()); if (type) p.set("t", type); history.replaceState(null, "", "#/work" + (p.toString() ? "?" + p : "")); $("#wres").innerHTML = wkList(workFilter(W, inp.value, type), inp.value, type); }, 120); });
  window.scrollTo(0, 0);
  if (text && !matchMedia("(pointer:coarse)").matches) inp.focus();
}
function wkList(hits, text, type) {
  if (!hits.length) return `<p class="note">Nothing in the Workspace matches “${esc(text)}”. Try a shorter word, a form number such as MGT-14, or <a href="#/work">see everything</a>.</p>`;
  const lim = text || type ? 120 : 24, shown = hits.slice(0, lim);
  return `<p class="note">${hits.length} ${hits.length === 1 ? "result" : "results"}${text || type ? "" : ". Showing the first " + shown.length + ". Use the tabs or the search to narrow down."}</p><div class="wgrid">${shown.map(workCard).join("")}</div>${hits.length > shown.length ? `<p class="note">Showing ${shown.length} of ${hits.length}. Type more of the name to narrow the list.</p>` : ""}`;
}

/* one kind of task: its own page, with a list and the working area */
async function showWorkKind(kind, id, q) {
  const my = ++S.token; S.cur = null; S.d = null; S.lodrBuild = null;
  const type = { processes: "proc", resolutions: "res", drafts: "draft", generators: "gen", forms: "form" }[kind];
  setArea(`/work/${kind}`); setChrome();
  if (kind === "processes") return showProcesses(id || "");
  if (kind === "resolutions") return showRes(id || "", q);
  if (kind === "forms") return showFormsPage(q);
  const W = await workItems(); if (my !== S.token) return;
  const items = W.filter(i => i.type === type), cur = items.find(i => i.id === id);
  const title = WT_TEXT[type][0];
  document.title = `${cur ? cur.t + " | " : ""}${title} | Compliance Lab`;
  const groups = {}; items.forEach(i => { (groups[i.g || "Other"] = groups[i.g || "Other"] || []).push(i); });
  const list = Object.keys(groups).map(g => `<details class="wk-g"${cur && cur.g === g ? " open" : ""}><summary>${esc(g)}<small>${groups[g].length}</small></summary>${groups[g].map(i => `<a href="#/work/${kind}/${esc(i.id)}"${cur && cur.id === i.id ? ' aria-current="page"' : ""} data-k="${esc(i.hay)}">${esc(i.t)}</a>`).join("")}</details>`).join("");
  const src = cur ? (kind === "drafts" ? `drafts/index.html?embed=1#${encodeURIComponent(cur.id)}` : `generators/index.html?embed=1#${encodeURIComponent(cur.id)}`) : "";
  show(`<section class="pg wk wide">${crumbs([["Home", "#/"], ["Workspace", "#/work"], [title, cur ? `#/work/${kind}` : ""]].concat(cur ? [[cur.t, ""]] : []))}
    <div class="wk-split"><aside class="wk-side"><h2>${title}</h2><p class="small">${WT_TEXT[type][1]}</p><input id="wkq" type="search" placeholder="Filter ${title.toLowerCase()}" autocomplete="off" aria-label="Filter ${title.toLowerCase()}"><div id="wkl">${list}</div></aside>
    <div class="wk-main">${cur ? `<iframe id="wkf" class="wk-frame" title="${esc(cur.t)}" src="${src}" loading="eager"></iframe>` : `<div class="wk-empty"><h1>${title}</h1><p class="lede">${WT_TEXT[type][1]}</p><p>Choose one from the list to open it here. You do not need to leave the Workspace.</p><div class="wgrid">${items.slice(0, 12).map(workCard).join("")}</div></div>`}</div></div></section>`, false);
  $("#wkq").addEventListener("input", e => { const v = e.target.value.toLowerCase().split(/\s+/).filter(Boolean); $$("#wkl a").forEach(a => a.hidden = !!v.length && !v.every(w => a.dataset.k.includes(w))); $$("#wkl details").forEach(d => { const any = $$("a", d).some(a => !a.hidden); d.hidden = !any; if (v.length) d.open = any; }); });
  window.scrollTo(0, 0);
  const f = $("#wkf"); if (f) { const a = $("[aria-current=page]", $("#wkl")); if (a) a.scrollIntoView({ block: "nearest" }); }
}
window.addEventListener("message", e => {
  const f = $("#wkf"); if (!f || e.source !== f.contentWindow || !e.data || typeof e.data.cl_h !== "number") return;
  f.style.height = Math.max(520, Math.min(e.data.cl_h, 20000)) + "px";
});

/* E-forms: the old Forms page becomes a task list inside the Workspace */
const _showForms = showForms;
async function showFormsPage(q) {
  await _showForms(q);
  const h = $(".forms-pg h1"); if (h) h.textContent = "E-forms";
  const cr = $(".forms-pg > p.small"); if (cr) cr.outerHTML = crumbs([["Home", "#/"], ["Workspace", "#/work"], ["E-forms", ""]]);
  const l = $(".forms-pg .lede"); if (l) l.textContent = "Every form named in the Rules, with its filing steps and checklist, the Rules that use it and the section it is made under.";
}

/* ---------- saved and notes ---------- */
function showSaved() { setArea("/saved"); showWorkspace(); const h = $(".pg h1"); if (h) { h.textContent = "Saved and notes"; h.insertAdjacentHTML("beforebegin", crumbs([["Home", "#/"], ["Library", "#/library"], ["Saved and notes", ""]])); } }

/* ---------- tools hub ---------- */
function showToolsHub() {
  S.cur = null; S.d = null; S.token++; setArea("/tools"); setChrome(); document.title = "Tools | Compliance Lab";
  const T = [
    ["calendar/", "Compliance calendar", "Due dates for the year, by company type, with reminders you can add to Google Calendar."],
    ["excel/", "Excel utilities", "Clean and convert registers and lists in your browser. Files are not uploaded."],
    ["stamp/", "Stamp duty", "Find the duty payable on a document in your state."],
    ["#/tools/calculator", "Notice and date calculator", "Notice periods, AGM and ROC due dates, and deadlines after an event."],
    ["#/tools/pack", "Section pack", "Put chosen sections, their Rules and your notes into one document to print or open in Word."]
  ];
  show(`<section class="pg">${crumbs([["Home", "#/"], ["Tools", ""]])}<h1>Tools</h1><p class="lede">Small tools that run in your browser, for dates, files and duties.</p>
    <div class="cardgrid">${T.map(t => `<a class="card2" href="${t[0]}"><b>${t[1]}</b><span>${t[2]}</span></a>`).join("")}</div></section>`);
  window.scrollTo(0, 0);
}
function showCalc() { setArea("/tools/calculator"); showTools(); const h = $(".pg h1"); if (h) h.insertAdjacentHTML("beforebegin", crumbs([["Home", "#/"], ["Tools", "#/tools"], ["Date calculator", ""]])); }
function showPackPage() { setArea("/tools/pack"); showPack(); }

/* ---------- routing ---------- */
const redirects = [[/^\/me$/, "/saved"], [/^\/forms$/, "/work/forms"], [/^\/processes(.*)$/, "/work/processes$1"], [/^\/resolutions(.*)$/, "/work/resolutions$1"], [/^\/pack$/, "/tools/pack"], [/^\/tools$/, null]];
function parseHash() {
  const h = location.hash.replace(/^#/, "") || "/"; const [p, qs] = h.split("?");
  const m = p.match(/^\/s\/([^/]+)/);
  return { sec: m ? decodeURIComponent(m[1]).toUpperCase() : null, q: new URLSearchParams(qs || "") };
}
async function route() {
  if (!S.idx) return;
  const hh = location.hash.replace(/^#/, "") || "/", [hb0, qs] = hh.split("?"), q = new URLSearchParams(qs || "");
  let hb = hb0.replace(/\/+$/, "") || "/";
  for (const [re, to] of redirects) if (to && re.test(hb)) { const nb = hb.replace(re, to); location.replace("#" + nb + (qs ? "?" + qs : "")); return; }
  palClose(true);
  setArea(hb);
  if (hb === "/") return showHome();
  if (hb === "/library") return showLibrary();
  if (hb === "/act") return showAct();
  if (hb === "/saved") return showSaved();
  if (hb === "/search") { palOpen("all", q.get("q") || ""); return showHome(); }
  if (hb.startsWith("/rules")) return showRules(hb.slice(7));
  if (hb.startsWith("/lodr")) return showLodr(hb.slice(6), q);
  if (hb === "/cases") return showCases(q);
  if (hb.startsWith("/cases/")) return showCase(hb.slice(7));
  if (hb === "/work") return showWork(q);
  if (hb.startsWith("/work/")) { const m = hb.match(/^\/work\/(processes|resolutions|drafts|generators|forms)(?:\/(.*))?$/); if (m) { const raw = m[2] || ""; return showWorkKind(m[1], /^(drafts|generators)$/.test(m[1]) ? decodeURIComponent(raw) : raw, q); } }
  if (hb === "/tools") return showToolsHub();
  if (hb === "/tools/calculator") return showCalc();
  if (hb === "/tools/pack") return showPackPage();
  const { sec } = parseHash();
  if (!sec) return showHome();
  if (S.map[sec] === undefined) { setChrome(); return show(`<div class="msg"><p>The Act has no section ${esc(sec)}. Sections run from 1 to ${esc(S.order[S.order.length - 1])}.</p><p><a href="#/act">See the contents of the Act</a> or press <kbd>/</kbd> to search.</p></div>`); }
  await showSection(sec, q);
}
const RECENT_KIND = h => /^#\/s\//.test(h) ? "Companies Act" : /^#\/rules\/\d+\/./.test(h) ? "Rule" : /^#\/lodr\/./.test(h) ? "SEBI LODR" : /^#\/cases\/./.test(h) ? "Case law" : /^#\/work\/resolutions\/./.test(h) ? "Resolution" : /^#\/work\/processes\/./.test(h) ? "Process" : /^#\/work\/(drafts|generators)\/./.test(h) ? "Workspace" : /^#\/work\/forms/.test(h) ? "E-form" : "";
function noteRecent() {
  const h = location.hash, k = RECENT_KIND(h); if (!k) return;
  setTimeout(() => {
    if (location.hash !== h) return;
    let t = document.title.split(" | ")[0].trim(); if (!t || /^Company Law/.test(t)) return;
    if (k === "Companies Act" && /^#\/s\/([^?]+)/.test(h)) t = "Section " + decodeURIComponent(h.match(/^#\/s\/([^?]+)/)[1]) + ", " + t.replace(/^\d+[A-Z]{0,2}\.\s*/, "");
    else t = t.replace(/^(Regulation \S+?)\.\s+/, "$1, ").replace(/^(Schedule \S+?)\.\s+/, "$1, ");
    store.set("recent2", JSON.stringify([{ h: h.split("&")[0], t: t.slice(0, 90), k }, ...recentList().filter(x => x.h !== h.split("&")[0])].slice(0, 12)));
  }, 900);
}
window.addEventListener("hashchange", noteRecent);
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (PAL.open) palClose(); const m = $("#aam"); if (m) m.hidden = true; document.body.classList.remove("rail-open"); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); palOpen(); } return; }
  if (e.target.matches && e.target.matches("input,textarea,select,[contenteditable]")) return;
  if (e.key === "/") { e.preventDefault(); palOpen(); }
  else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && S.cur && !PAL.open) {
    const i = S.order.indexOf(S.cur) + (e.key === "ArrowRight" ? 1 : -1);
    if (S.order[i]) location.hash = `#/s/${S.order[i]}`;
  }
});

async function init() {
  applyPrefs();
  try { S.idx = await getJSON("data/index.json"); }
  catch (e) { return showMessage(`<p>Could not load the Act. If you opened this file from your computer, open the website link instead. Otherwise check your connection and reload.</p>`); }
  S.idx.sections.forEach((r, i) => { S.map[r[0]] = i; S.order.push(r[0]); });
  S.rt = {}; S.idx.rules.forEach(r => { S.rt[r[0] + ":" + r[1]] = r[2]; });
  route(); noteRecent();
  (window.requestIdleCallback || setTimeout)(() => { getJSON("data/fulltext.json").then(f => { S.ft = f; S.ftKeys = Object.keys(f); }).catch(() => {}); });
}
init();

})();
</script>
