<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#662b40">
  <title>Practice desk · Compliance Desk</title>
  <meta name="description" content="A working desk for Indian company secretaries. Read linked legislation, follow procedure checklists and prepare editable documents.">
  <link rel="icon" href="desk/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="desk/style.css">
  <script>if(location.hash.startsWith('#/')) location.replace('reference.html'+location.hash)</script>
  <script src="desk/forms.js" defer></script>
  <script src="desk/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="masthead">
  <div class="brand-wrap"><button type="button" id="menu-toggle" class="iconbtn mobile-only" aria-label="Open navigation" aria-expanded="false"><span data-icon="menu"></span></button>
  <a class="brand" href="#overview" aria-label="Compliance Desk home"><img src="desk/mark.svg" alt="" width="40" height="42"><span>Compliance Desk</span></a></div>
  <div class="mast-tools"><span class="today"><span data-icon="calendar"></span><time id="today"></time></span><span class="mast-divider"></span><button id="global-search" class="iconbtn" aria-label="Search the desk"><span data-icon="search"></span></button><a class="savetop" href="#saved"><span data-icon="bookmark"></span> <span>Saved</span><span id="saved-count"></span></a></div>
</header>
<div class="workspace">
  <aside id="sidebar" class="sidebar" aria-label="Sidebar">
    <nav aria-label="Main navigation">
      <div class="nav-group"><h2>Workspace</h2>
        <a href="#overview" data-nav="overview"><span data-icon="grid"></span>Overview</a>
        <a href="#procedures" data-nav="procedures"><span data-icon="checklist"></span>Procedure library</a>
        <a href="#documents" data-nav="documents"><span data-icon="pen"></span>Document studio</a>
      </div>
      <div class="nav-group"><h2>Legal references</h2>
        <a href="#library/act" data-nav="act"><span data-icon="book"></span>Companies Act</a>
        <a href="#library/rule" data-nav="rule"><span data-icon="layers"></span>Companies Rules</a>
        <a href="#library/lodr" data-nav="lodr"><span data-icon="columns"></span>SEBI LODR</a>
      </div>
      <div class="nav-group"><h2>Personal</h2>
        <a href="#saved" data-nav="saved"><span data-icon="bookmark"></span>Saved items</a>
      </div>
    </nav>
    <div class="side-bottom"><a href="reference.html" class="legacy"><span data-icon="archive"></span>Original dashboard<span data-icon="external"></span></a></div>
  </aside>
  <button id="side-shade" aria-label="Close navigation" hidden></button>
  <main id="main" tabindex="-1"><div class="crumb" id="crumb" aria-label="Breadcrumb"></div><div id="page"><p class="load-text">Opening your practice desk…</p></div></main>
</div>
<dialog id="search-dialog" aria-labelledby="search-title">
  <div class="modal-head"><h2 id="search-title">Search the desk</h2><button type="button" class="iconbtn" id="close-search" aria-label="Close search"><span data-icon="x"></span></button></div>
  <form id="search-form" role="search"><span data-icon="search"></span><input id="search-input" type="search" placeholder="Section, regulation, procedure or form…" aria-label="Search the desk" autocomplete="off"></form>
  <div id="search-results" aria-live="polite"></div>
</dialog>
<div id="notice" role="status" aria-live="polite"></div>
<noscript><p>Enable JavaScript to open the procedure checklists and linked statute reader.</p></noscript>
</body>
</html>
